name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Quality Gate Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  build-release:
    name: Build Windows Installer & Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Set up Inno Setup
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          } elseif (Test-Path "C:\Program Files\Inno Setup 6") {
            echo "C:\Program Files\Inno Setup 6" >> $env:GITHUB_PATH
          } else {
            choco install innosetup --yes --no-progress
            echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          }

      - name: Generate App Icon (.ico)
        run: |
          python -c "from PIL import Image; img = Image.open('assets/logo_clean.png'); img.save('assets/app.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Build PyInstaller Bundle
        run: |
          $spec = (Get-ChildItem -Filter "Seednox-Windows-*.spec" | Select-Object -First 1).Name
          Write-Host "Building using spec file: $spec"
          python -m PyInstaller $spec --noconfirm

      - name: Compile Inno Setup Installer
        run: |
          iscc Seednox-Setup.iss

      - name: Create Portable ZIP Archive
        run: |
          $distFolder = (Get-ChildItem -Path dist -Directory -Filter "Seednox-Windows-*" | Select-Object -First 1)
          $tag = "${{ github.ref_name }}"
          $zipPath = "dist/Seednox-$tag-Windows-x64.zip"
          Write-Host "Compressing $($distFolder.FullName) into $zipPath"
          Compress-Archive -Path "$($distFolder.FullName)\*" -DestinationPath $zipPath -Force

      - name: Generate Checksums (SHA256)
        run: |
          $artifacts = Get-ChildItem -Path dist -Recurse -File -Include "*.exe", "*.zip"
          Get-FileHash $artifacts.FullName -Algorithm SHA256 | Format-List > SHA256SUMS.txt

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            SHA256SUMS.txt
          generate_release_notes: true
