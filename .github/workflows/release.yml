name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Quality Gate Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  build-release:
    name: Build Windows Installer & Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate App Icon (.ico)
        run: |
          python -c "from PIL import Image; img = Image.open('assets/logo_clean.png'); img.save('assets/app.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Build PyInstaller Bundle
        run: |
          pyinstaller Seednox-Windows-v1.0.2.spec

      - name: Compile Inno Setup Installer
        run: |
          iscc Seednox-Setup.iss

      - name: Create Portable ZIP Archive
        run: |
          Compress-Archive -Path dist\Seednox-Windows-v1.0.2\* -DestinationPath dist\Seednox-v1.0.2-Windows-x64.zip -Force

      - name: Generate Checksums (SHA256)
        run: |
          Get-FileHash dist\Seednox-Setup-v1.0.2.exe, dist\Seednox-v1.0.2-Windows-x64.zip -Algorithm SHA256 | Format-List > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Seednox-Setup-v1.0.2.exe
            dist/Seednox-v1.0.2-Windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 📦 Официальные сборки Seednox v1.0.2

            - 🚀 **`Seednox-Setup-v1.0.2.exe`** — Установочный мастер для Windows (рекомендуется).
            - 📁 **`Seednox-v1.0.2-Windows-x64.zip`** — Портативная версия без установки.

            ## 🔒 Проверка целостности (SHA256)

            Сверьте хеши в `SHA256SUMS.txt` после скачивания:
            ```powershell
            Get-FileHash Seednox-Setup-v1.0.2.exe -Algorithm SHA256
            ```
